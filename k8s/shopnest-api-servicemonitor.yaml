apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shopnest-api-gateway
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - ecommerce
  selector:
    matchLabels:
      monitoring: shopnest
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
